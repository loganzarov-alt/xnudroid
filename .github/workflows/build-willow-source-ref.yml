name: Build Willow source reference

on:
  push:
    branches: [willow-source-ref]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    timeout-minutes: 120

    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git make gcc g++ gcc-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev cpio gzip xz-utils file \
            python3 python3-distutils

      - name: Checkout xnudroid
        uses: actions/checkout@v4

      - name: Fetch official Xiaomi Redmi Note 8T kernel source
        shell: bash
        run: |
          git clone --depth=1 --branch willow-p-oss \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel
          git -C kernel rev-parse HEAD | tee xiaomi-kernel-commit.txt

      - name: Configure official trinket kernel
        shell: bash
        run: |
          set -euxo pipefail
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          mkdir -p out
          make -C kernel O="$GITHUB_WORKSPACE/out" vendor/trinket-perf_defconfig
          grep -E 'CONFIG_ARCH_TRINKET=|CONFIG_DRM=|CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=' out/.config

      - name: Build Image.gz-dtb
        shell: bash
        run: |
          set -euxo pipefail
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make -C kernel O="$GITHUB_WORKSPACE/out" -j"$(nproc)" Image.gz-dtb
          test -s out/arch/arm64/boot/Image.gz-dtb
          file out/arch/arm64/boot/Image.gz-dtb
          cp out/.config willow-kernel.config

      - name: Build tiny ZAROS initramfs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ramdisk
          aarch64-linux-gnu-gcc -O2 -static -s tools/zaros_init.c -o ramdisk/init
          file ramdisk/init
          (
            cd ramdisk
            find . -print0 | cpio --null -ov --format=newc | gzip -9
          ) > zaros-ramdisk.cpio.gz

      - name: Pack Android boot image v2
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 --branch android-11.0.0_r48 \
            https://android.googlesource.com/platform/system/tools/mkbootimg mkbootimg

          CMDLINE='console=ttyMSM0,115200n8 androidboot.hardware=qcom androidboot.console=ttyMSM0 androidboot.memcg=1 lpm_levels.sleep_disabled=1 msm_rtb.filter=0x237 service_locator.enable=1 swiotlb=1 earlycon=msm_geni_serial,0x4a90000 cgroup.memory=nokmem,nosocket androidboot.selinux=permissive androidboot.usbconfigfs=true'

          python3 mkbootimg/mkbootimg.py \
            --header_version 2 \
            --kernel out/arch/arm64/boot/Image.gz-dtb \
            --ramdisk zaros-ramdisk.cpio.gz \
            --base 0x00000000 \
            --pagesize 4096 \
            --ramdisk_offset 0x01000000 \
            --tags_offset 0x00000100 \
            --cmdline "$CMDLINE" \
            --output zaros-willow-v0.4-source-ref.img

          file zaros-willow-v0.4-source-ref.img
          sha256sum zaros-willow-v0.4-source-ref.img | tee zaros-willow-v0.4-source-ref.sha256

      - name: Upload source-reference artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zaros-willow-v0.4-source-ref
          if-no-files-found: error
          path: |
            zaros-willow-v0.4-source-ref.img
            zaros-willow-v0.4-source-ref.sha256
            willow-kernel.config
            xiaomi-kernel-commit.txt
